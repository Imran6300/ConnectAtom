name: Deploy ConnectAtom to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connectatom-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy ConnectAtom
        run: npm run deploy:vinext
        env:
          API_ORIGIN: https://api.connectatom.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Diagnose Cloudflare build output
        if: always()
        run: |
          echo "Checking Cloudflare output directories"
          find .cloudflare -maxdepth 6 -type f -print || true
          echo "Checking output configuration"
          if [ -f .cloudflare/output/v1/config.json ]; then
            cat .cloudflare/output/v1/config.json
          else
            echo "Missing .cloudflare/output/v1/config.json"
          fi
          echo "Checking generated Worker configuration"
          find .cloudflare/output -name "config.json" -o -name "wrangler.json" || true
